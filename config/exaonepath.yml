#### general settings and paths settings
results_dir: ./checkpoints

### model settings
model_type: exaonepath
num_classes: 2

### train settings
gpu_ids: 1
num_workers: 4
batch_size: 128
use_fp16: 0

max_epochs: 100
lr: 0.0002

bar: 0
in_memory: 1
gc: 2
early_stopping: True

opt: adamw #['adam', 'sgd', 'adamw']
reg: 1e-02 # L2-regularization weight decay
lambda_reg: 0.0001 #L1-Regularization Strength

### other settings
seed: 42

